<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle Inner Border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="8"/>
  
  <!-- Open Book -->
  <g filter="url(#shadow)">
    <!-- Left Page -->
    <path d="M 128 160 C 176 144, 232 152, 256 168 L 256 368 C 232 352, 176 344, 128 360 Z" fill="#FFFFFF" opacity="0.95"/>
    <!-- Right Page -->
    <path d="M 384 160 C 336 144, 280 152, 256 168 L 256 368 C 280 352, 336 344, 384 360 Z" fill="#F1F5F9"/>
    <!-- Book Lines -->
    <line x1="152" y1="200" x2="224" y2="192" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
    <line x1="152" y1="232" x2="224" y2="224" stroke="#CBD5E1" stroke-width="6" stroke-linecap="round"/>
    <line x1="152" y1="264" x2="210" y2="258" stroke="#CBD5E1" stroke-width="6" stroke-linecap="round"/>
    
    <line x1="288" y1="192" x2="360" y2="200" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
    <line x1="288" y1="224" x2="360" y2="232" stroke="#CBD5E1" stroke-width="6" stroke-linecap="round"/>
    <line x1="288" y1="258" x2="346" y2="264" stroke="#CBD5E1" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Spine Line -->
    <path d="M 256 168 L 256 368" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- AI Sparkle Stars -->
  <path d="M 376 100 Q 376 140 416 140 Q 376 140 376 180 Q 376 140 336 140 Q 376 140 376 100 Z" fill="url(#starGrad)" filter="url(#shadow)"/>
  <path d="M 160 110 Q 160 130 180 130 Q 160 130 160 150 Q 160 130 140 130 Q 160 130 160 110 Z" fill="#6EE7B7" opacity="0.9"/>
</svg>
